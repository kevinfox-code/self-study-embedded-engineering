name: Agentic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-checks:
    name: Build and Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake shellcheck gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Verify ARM toolchain
        run: |
          arm-none-eabi-gcc --version

      - name: Run forbidden-artifact check
        run: bash .github/scripts/check_forbidden_artifacts.sh

      - name: Run shellcheck on scripts
        run: |
          if command -v shellcheck >/dev/null; then
            find .github -name "*.sh" -print0 | xargs -0 --no-run-if-empty shellcheck || true
          fi

      - name: Discover and build subprojects
        run: |
          set -euo pipefail
          echo "Looking for Makefile and CMakeLists.txt in repository..."
          mapfile -t makefiles < <(git ls-files -- "**/Makefile" 2>/dev/null | sed 's#/Makefile$##' || true)

          mapfile -t cmakefiles < <(git ls-files -- "**/CMakeLists.txt" 2>/dev/null || true)
          cmakelists=()
          for cmakefile in "${cmakefiles[@]:-}"; do
            project_dir=$(dirname "$cmakefile")
            parent_dir=$(dirname "$project_dir")
            nested=false

            while [[ "$parent_dir" != "." && "$parent_dir" != "/" ]]; do
              if [[ -f "$parent_dir/CMakeLists.txt" ]]; then
                nested=true
                break
              fi
              parent_dir=$(dirname "$parent_dir")
            done

            if [[ "$nested" == false ]]; then
              cmakelists+=("$project_dir")
            fi
          done

          echo "Make projects: ${makefiles[*]}"
          echo "CMake projects: ${cmakelists[*]}"

          for d in "${makefiles[@]:-}"; do
            echo "Building Make project in: $d"
            pushd "$d"
            make -j$(nproc)
            popd
          done

          for d in "${cmakelists[@]:-}"; do
            echo "Building CMake project in: $d"
            if [[ -f "$d/CMakePresets.json" ]]; then
              pushd "$d"
              cmake --preset Debug
              cmake --build --preset Debug --parallel $(nproc)
              if command -v ctest >/dev/null 2>&1; then
                ctest --preset Debug --output-on-failure || true
              fi
              popd
            else
              toolchain_file=$(find "$d" -path '*/gcc-arm-none-eabi.cmake' -print -quit)
              mkdir -p "$d/build"
              pushd "$d/build"
              if [[ -n "$toolchain_file" ]]; then
                cmake .. -DCMAKE_TOOLCHAIN_FILE="$toolchain_file"
              else
                cmake ..
              fi
              cmake --build . --parallel $(nproc)
              if command -v ctest >/dev/null 2>&1; then
                ctest --output-on-failure || true
              fi
              popd
            fi
          done
